  - id: CHAT-103
    title: "Email verification requires a live single-use owner proof"
    user_story: |
      As a user, direct verification and expired proofs leave my pending link
      unchanged. Eight concurrent requests using one valid proof yield exactly
      one success and one persisted, verified, enabled link. Replay cannot
      change it, and another user's proof cannot take over my linked email.
      This exercises authenticated HTTP and the selected real database;
      SMTP delivery and injected storage failures are not covered by this case.
    priority: P0
    status: covered
    test_refs:
      - TestE2E_SecurityUrgentChannelProofLifecycle

  - id: CHAT-105
    title: "Organization provider secrets remain scoped through masked updates"
    user_story: |
      As an org owner I can read masked provider settings and preserve, replace,
      omit, delete or clear my own provider secrets. Stale, foreign and nonexistent
      masks are rejected without mutation, including mixed valid/invalid updates.
      Members cannot read or write org provider settings. Every operation leaves
      other organizations and platform settings unchanged. Coverage is implemented;
      live PostgreSQL/SQLite acceptance remains outstanding.
    priority: P0
    status: covered
    test_refs:
