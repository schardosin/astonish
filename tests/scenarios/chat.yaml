  - id: CHAT-109
    title: "First-run setup requires a bootstrap capability and persists a usable administrator"
    user_story: |
      With auth mode none or builtin, missing or wrong bootstrap tokens cannot
      initialize either endpoint, even over loopback with a forwarded header.
      An authorized SQLite setup persists the requested configuration, admin,
      organization and General team memberships. Both configured init retries
      fail without changing files or creating replacement data. Builtin mode
      additionally restarts from persisted config, rejects anonymous settings
      access, and logs in with the setup credentials to resolve the correct
      owner/superadmin identity and read authorized platform/team settings.
      This uses temporary SQLite even in the PostgreSQL matrix leg; positive
      PostgreSQL setup and a live acceptance run remain separate obligations.
      Separately, TestE2E_FirstRunSetupProcessContinuity exercises setup/restart
      in distinct test-binary processes using temporary SQLite and local HTTP
      for builtin and none modes. It is not selected by the urgent prefix and
      proves neither a real daemon binary launch nor PostgreSQL setup.
    priority: P0
    status: covered
    test_refs:
      - TestE2E_SecurityUrgentFirstRunSetup

  - id: CHAT-110
    title: "Standard MCP install and uninstall enforce independent scope authority"
    user_story: |
      Twenty-one cases exercise both install and uninstall. Members cannot write
      default-team, team, org or platform scope; an org owner cannot write platform
      scope. Effective, unknown and forged foreign-team scopes are rejected.
      An org owner/team admin can write default-team, team and org scope. An
      independent team admin/org member can write default-team and team scope,
      but not org/platform scope or a sibling team selected through the header.
      Those narrow writes and denials preserve global secret ciphertext and
      legacy credentials. Four additional cases start without global secrets or
      credentials keys: default-team/team/org install and uninstall plus member
      denial preserve that absence and unrelated scoped/platform settings.
      An authenticated platform admin can install/uninstall
      at platform scope, replacing/removing only Tavily's global secret and
      removing its legacy fallback on uninstall while preserving unrelated
      secrets and credentials. All cases preserve unrelated MCP configuration
      and verify secret-free responses; successful installs check the creator.
      Synthetic keys do not prove successful Tavily discovery or tool use.
      Coverage is implemented; live PostgreSQL/SQLite acceptance is outstanding.
    priority: P0
    status: covered
    test_refs:
      - TestE2E_SecurityUrgentMCPInstallIsolation

  - id: CHAT-111
    title: "Independent administrative roles retain only their authorized settings writes"
    user_story: |
      An org admin who is only a team member can change team settings and org
      providers. A team admin who is only an org member can change team providers,
      and an independent platform admin can change full deployment config.
      The four cases pair nonempty authorized writes with forbidden writes and
      secret-free responses, then compare persisted target and unrelated scope
      snapshots and deployment config. Overlapping owner/team privileges cannot
      substitute for independent role authority. Coverage is implemented, not
      a passing live PostgreSQL/SQLite security matrix.
    priority: P0
    status: covered
    test_refs:
      - TestE2E_SecurityUrgentIndependentRoleAuthority

  - id: CHAT-115
    title: "Approved disposable PostgreSQL first-run setup survives a process restart"
    user_story: |
      An operator separately approves an entire disposable PostgreSQL instance,
      not merely a database suffix. Authenticated bootstrap setup persists config;
      registration/login establishes the first owner/superadmin and general-team
      administrator. A separate test-binary process reopens the same identity and
      config. Configured retries reject both init endpoints without mutation.
      This test is mandatory only in the PostgreSQL urgent leg; no SQLite stand-in
      or skip satisfies it. Missing dedicated-instance approval fails before effects.
