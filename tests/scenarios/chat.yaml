  - id: CHAT-108
    title: "Platform provider management preserves platform-only secret authority"
    user_story: |
      As a platform admin, I read redacted providers and preserve exact masks,
      replace, omit, delete or clear secrets. Stale, missing, foreign-org and
      foreign-team masks, unknown fields and mixed-invalid writes fail unchanged.
      Org owners, team admins and members cannot read or write platform providers
