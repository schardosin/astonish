  - id: CHAT-104
    title: "Consolidation authorizes every participant before changing memory"
    user_story: |
      As a team member, a forbidden source, duplicate, discard participant or
      existing destination rejects the entire consolidation without changing any
      persisted team memory, including my authorized source. When I own all
      participants, consolidation replaces sources, removes duplicates, discards
      unusable memories or updates the existing card without changing unrelated
      records. This tests authorization atomicity, not rollback after DB failures.
    priority: P0
    status: covered
    test_refs:
      - TestE2E_SecurityUrgentMemoryParticipants

  - id: CHAT-113
    title: "Consolidation preserves scope plus ID, not equal IDs in other scopes"
    user_story: |
      As an authorized memory owner, consolidating into an existing team card
      deletes a personal or org source/duplicate even when its handler-visible ID
      equals the destination ID. Eight cases cover source/duplicate, personal/org,
      and success/failure. Success deletes exactly one participant and retains the
      updated team destination. Injected delete failures return a bounded 500,
      never applied:true or storage canaries, and retain the failed participant
      and updated destination; unrelated persisted rows remain unchanged.
      This reuses local temporary-SQLite registered routes, JWT authentication and
      tenant middleware. Because MemoryStore.Add generates IDs, scoped wrappers
      use ID aliasing over distinct real SQLite rows: not a SQL-level collision.
      It proves local HTTP and backing persistence with injected pre-delete errors,
      not actual database failure, rollback, PostgreSQL, Kubernetes or full live
      urgent-matrix acceptance. The parent and all eight leaves are required by
      strict acceptance; the existing six local deletion-failure tests are retained.
    priority: P0
    status: covered
    test_refs:
      - TestE2E_SecurityUrgentScopedMemoryCleanup
      - TestE2E_Memory_LocalDeletionFailures

  - id: CHAT-106
    title: "Identical team slugs in different organizations do not share sessions"
    user_story: |
      As an org owner in a team whose slug matches another organization's team,
