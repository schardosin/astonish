  - id: CHAT-114
    title: "Full configuration masks remain bound to their authorized credential destinations"
    user_story: |
      An independent platform admin uses GET/PUT /api/settings/full to round-trip
      masked proxy/CDP URLs and embedding keys without losing encoded or repeated
      query data or trusted VNC settings. Nonsecret edits persist. Twenty-three
      invalid, nonexistent or changed-destination masks return 400 and preserve
      the configuration file byte-for-byte. Ten masked/malformed writes from
      anonymous, org-owner, independent org-admin, team-admin and member actors
      return 401/403, never 5xx. Six legitimate updates cover omission, null,
      clearing, replacement and changed destinations with explicit clear or
      replacement, checking persisted values and masked readback.
      TestE2E_SecurityUrgentFullConfigMasksLocal has 40 leaves and 12 real nested
      parents, all mandatory in strict acceptance. It uses temporary SQLite,
      loopback HTTP, registered routes, JWT and tenant middleware, not login,
      external infrastructure, provider calls, a real daemon or Kubernetes.
      Local success is not live PostgreSQL/SQLite urgent-matrix acceptance.
    priority: P0
    status: covered
    test_refs:
      - TestE2E_SecurityUrgentFullConfigMasksLocal

  - id: CHAT-112
    title: "Scoped and legacy MCP mutations enforce authority over local HTTP"
    user_story: |
      Legacy PATCH /api/mcp/servers/{name} and POST /api/mcp/{name}/refresh
      reject unauthenticated/invalid-JWT requests, unauthorized members and
      independent admins, sibling/foreign teams, and effective/unknown scopes.
      Each operation has 17 denial cases preserving all persistence snapshots.
      Four authorized refresh cases and four authorized missing-row toggle cases
      return 404 without mutation or discovery at default-team, explicit-team,
      org and platform scope. Each subcase exercises both the legacy route and
      its /api/mcp-platform/servers/{name} counterpart (/refresh for POST).
      Default-team lookup cannot mutate a platform-only row, and
      missing team/platform stores fail closed for both PATCH and POST (503).
      Four successful toggles persist only the authorized explicit/default team,
      org-owner or platform-only row and report its state. Five platform-only
      standard install/uninstall cases set platform web-tool references, then
      clear only matching search/extract references (both, search only, extract
      only, neither, and matching references in another scope). Complete team
      settings and unrelated platform fields remain unchanged, including matching
      team references. The original 56 cases are preserved, with 167 additional outcomes:
      28 scoped mutations (create, update, toggle, inline install, legacy settings,
      legacy patch, delete) across org_admin_default, org_admin_team, org_admin_org
      and platform_only; eight existing-row refreshes across those scopes and both
      modern/legacy routes; and three org-admin standard install/uninstall pairs.
      The org admin is only a team member and has no platform role. Narrow installs
      preserve global secrets and update current-team web-tool references even
      when the MCP row is org-scoped. Existing-row refresh checks the selected
      scoped command while retaining caches and persistence, not discovery success.
      Another 126 cases reject nine operations (create, update, delete, toggle,
      refresh, inline install, legacy settings, standard install/uninstall) across
      14 unauthenticated, member, independent-admin, invalid-scope and missing-store
      conditions. Two legacy patch/refresh cases reject org_admin_platform.
      Added cases compare scoped rows, caches/timestamps, secrets, files and all
      scoped settings, permitting only intended mutations and no denial effects.
      Another 153 masked_update leaves cover team/org/platform across modern PUT
      (20 per scope), legacy settings PUT (18), and inline install POST (13).
      Exact masks restore only the selected row/key; inherited, nonexistent,
      wrong-target/key and changed execution destinations cannot reuse secrets.
      Legacy invalid batches preserve valid items and omitted rows atomically;
      inline creation rejects existing masks. Omission/null/empty, replacement
      and clear behavior is asserted per route, with masked GETs and persisted
      snapshots. Four modern team missing-row cases (nonexistent_env/url and
      inherited_env/url) expect bounded 500 storage failures, not authorization
      denial success. This unresolved notfound inconsistency with org/platform
      remains explicit; no 5xx is proof of authorization.
      These 376 subcases plus their parent are mandatory in both urgent matrix legs;
      slash-named leaves do not introduce intermediate parent groups.
      An invalid local sandbox backend stops discovery before external access;
      terminal records are awaited. Inherited chat initialization and credential-store hooks are cleared.
      This self-contained loopback HTTP/JWT test uses temporary SQLite regardless
      of the selected external backend, with test-issued tokens and persisted
      team membership. It does not exercise login, PostgreSQL, a real daemon,
      Kubernetes, provider calls, an MCP process, or successful discovery.
      Local coverage is not live PostgreSQL/SQLite urgent-matrix acceptance.
    priority: P0
    status: covered
    test_refs:
      - TestE2E_SecurityUrgentLegacyMCPLocalAuthorization
