  - id: CHAT-102
    title: "A team member retains private session ownership against an org owner"
    user_story: |
      As a team member, I can resume and delete my personal session. My org
      owner cannot list, read, delete or inject messages into it; rejected
      operations preserve my history.
    priority: P0
    status: covered
    test_refs:
